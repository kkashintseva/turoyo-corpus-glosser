[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "turoyo-corpus-glosser"
version = "0.4.0"
description = "Corpus-driven Turoyo gloss editor with FLEx and FieldWorks LIFT import"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
  "jinja2>=3.1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
turoyo-glosser = "maalula_glosser.cli:app"

[tool.hatch.build.targets.wheel]
# Internal package path is retained for compatibility with the existing editor code.
packages = ["src/maalula_glosser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
